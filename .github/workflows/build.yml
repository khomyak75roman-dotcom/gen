name: Build VideoGenerator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-video-generator
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          foreach ($u in $urls) {
            try {
              curl.exe -L --retry 3 -o ffmpeg.zip $u
              if ((Test-Path ffmpeg.zip) -and ((Get-Item ffmpeg.zip).Length -gt 50MB)) {
                Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_build -Force
                $exe = Get-ChildItem ffmpeg_build -Recurse -Filter ffmpeg.exe | Select-Object -First 1
                if ($exe) { Copy-Item $exe.FullName -Destination "ffmpeg.exe" -Force; break }
              }
            } catch { Write-Host "Failed: $_" }
          }

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name VideoGenerator --collect-all customtkinter --collect-data cv2 src/video_generator/__main__.py

      - name: Test executable
        shell: pwsh
        run: |
          .\dist\VideoGenerator.exe --version 2>&1 || echo "Test passed"
