name: Build VideoGenerator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-video-generator
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -Force
          $exe = Get-ChildItem -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName -Destination "ffmpeg.exe" -Force }

      - name: Build with PyInstaller
        shell: cmd
        run: |
          pyinstaller --onefile --windowed --name VideoGenerator ^
            --add-data "ffmpeg.exe;." ^
            --collect-all customtkinter ^
            --collect-all edge_tts ^
            --collect-data cv2 ^
            src/video_generator/__main__.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoGenerator-Installer
          path: |
            dist/VideoGenerator-Setup.exe
            dist/VideoGenerator.exe
          compression-level: 0
