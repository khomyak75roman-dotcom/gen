name: Build VideoGenerator

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-video-generator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_build -Force
          $exe = Get-ChildItem ffmpeg_build -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "ffmpeg.exe" -Force

      - name: Build with PyInstaller
        shell: cmd
        run: |
          pyinstaller --onefile --windowed --name VideoGenerator ^
            --add-data "ffmpeg.exe;." ^
            --collect-all customtkinter ^
            --collect-all edge_tts ^
            --collect-data cv2 ^
            src/video_generator/__main__.py

      - name: Test executable
        shell: pwsh
        run: |
          if (Test-Path .\dist\VideoGenerator.exe) {
            $sizeMB = (Get-Item .\dist\VideoGenerator.exe).Length / 1MB
            Write-Host "✅ Built: $([math]::Round($sizeMB, 2)) MB"
          } else {
            throw "❌ Executable not found"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGenerator
          path: |
            dist/VideoGenerator.exe
            ffmpeg.exe
          compression-level: 0
