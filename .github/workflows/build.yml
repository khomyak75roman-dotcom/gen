name: Build VideoGenerator

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-video-generator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=4.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $success = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Trying: $url"
              Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
              if (Test-Path ffmpeg.zip -and (Get-Item ffmpeg.zip).Length -gt 50MB) {
                Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_build -Force
                $exe = Get-ChildItem ffmpeg_build -Recurse -Filter ffmpeg.exe | Select-Object -First 1
                if ($exe) {
                  Copy-Item $exe.FullName -Destination "ffmpeg.exe" -Force
                  $success = $true
                  break
                }
              }
            } catch {
              Write-Host "Failed: $_"
            }
          }
          if (-not $success) {
            throw "Failed to download FFmpeg"
          }

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name VideoGenerator \
            --collect-all customtkinter \
            --collect-data cv2 \
            --icon=icon.ico \
            --version-file=version.txt \
            src/video_generator/__main__.py

      - name: Test executable
        shell: pwsh
        run: |
          if (Test-Path .\dist\VideoGenerator.exe) {
            Write-Host "Executable exists, size: $((Get-Item .\dist\VideoGenerator.exe).Length / 1MB) MB"
          } else {
            throw "Executable not found"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Prepare installer.iss
        shell: pwsh
        run: |
          $content = Get-Content installer.iss -Raw
          $content = $content -replace '\{app\}', 'C:\Program Files\VideoGenerator'
          $content = $content -replace '4\.0\.0', '${{ steps.version.outputs.version }}'
          $content | Out-File -Encoding UTF8 -FilePath installer.iss

      - name: Build installer
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGenerator-exe
          path: dist/VideoGenerator.exe
          compression-level: 0

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGenerator-Setup
          path: dist/VideoGenerator-Setup.exe
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/VideoGenerator-exe/VideoGenerator.exe
            artifacts/VideoGenerator-Setup/VideoGenerator-Setup.exe
          generate_release_notes: true
